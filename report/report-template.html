<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance report - __REPORT_TITLE__</title>
<style>
  /* Tokens: the validated reference palette (dataviz skill). Series slots 1-3 only; status colours are reserved for state. */
  :root {
    color-scheme: light;
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10); --track: #eceae4; --wash: rgba(11,11,11,.04);
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --good: #0ca30c; --good-text: #006300; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --track: #2c2c2a; --wash: rgba(255,255,255,.05);
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10); --track: #2c2c2a; --wash: rgba(255,255,255,.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --good-text: #0ca30c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .page { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0; font-weight: 650; }
  h2 { font-size: 15px; margin: 0; font-weight: 650; }
  .sub { color: var(--ink2); font-size: 13px; margin-top: 2px; }
  .muted { color: var(--ink2); }
  .head { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 14px; }
  .card > header { display: flex; flex-wrap: wrap; gap: 6px 16px; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }

  .banner { display: flex; gap: 12px; align-items: flex-start; border-left: 4px solid var(--c); }
  .banner .big { font-size: 16px; font-weight: 650; }
  .ico { display: inline-flex; width: 18px; height: 18px; border-radius: 50%; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; background: var(--c); flex: none; }
  .ico.warn, .ico.warning { color: #0b0b0b; }
  .good { --c: var(--good); } .warn { --c: var(--warn); } .crit { --c: var(--crit); } .info { --c: var(--s1); } .serious { --c: var(--serious); }

  .filters { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; position: sticky; top: 0; z-index: 5; background: var(--page); padding: 10px 0; margin-bottom: 4px; }
  .filters label { font-size: 12px; color: var(--ink2); display: flex; align-items: center; gap: 8px; }
  select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  select { min-width: 280px; max-width: 100%; }
  button { cursor: pointer; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; background: var(--surface); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
  :focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; }
  .kpi { background: var(--wash); border-radius: 8px; padding: 10px 12px; }
  .kpi .l { font-size: 12px; color: var(--ink2); }
  .kpi .v { font-size: 24px; font-weight: 650; letter-spacing: -.01em; margin-top: 2px; display: flex; align-items: center; gap: 8px; }
  .kpi .n { font-size: 12px; color: var(--ink2); }
  .caption { font-size: 12px; color: var(--ink2); margin-top: 8px; }

  ul.obs { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  ul.obs li { display: flex; gap: 10px; align-items: flex-start; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: middle; }
  th { font-size: 12px; font-weight: 600; color: var(--ink2); white-space: nowrap; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--wash); }
  .tablewrap { overflow-x: auto; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; white-space: nowrap; }
  .meth { font-size: 11px; font-weight: 650; border: 1px solid var(--axis); border-radius: 4px; padding: 0 5px; color: var(--ink2); margin-right: 6px; }
  .linklike { border: 0; background: none; padding: 0; color: var(--ink); text-align: left; text-decoration: underline; text-decoration-color: var(--axis); text-underline-offset: 3px; }
  .minibar { height: 4px; border-radius: 2px; background: var(--s1); margin-top: 4px; min-width: 2px; }
  .url { word-break: break-all; font-size: 12px; color: var(--ink2); }

  .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--ink2); }
  .legend .key, .tip .key { display: inline-block; width: 14px; height: 0; border-top: 2px solid var(--c); vertical-align: middle; margin-right: 6px; border-radius: 1px; }
  .chartbox { position: relative; }
  .chartbox svg { display: block; width: 100%; overflow: visible; }
  .chartbox + .chartbox { margin-top: 8px; }
  .strip-title { font-size: 12px; font-weight: 600; color: var(--ink2); margin: 10px 0 2px; }
  .tip { position: absolute; pointer-events: none; z-index: 4; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.14); white-space: nowrap; }
  .tip .t { color: var(--ink2); margin-bottom: 4px; }
  .tip .row { display: flex; gap: 14px; justify-content: space-between; align-items: center; }
  .tip .row b { font-weight: 650; font-variant-numeric: tabular-nums; }
  #gtip { position: fixed; z-index: 20; pointer-events: none; }
  svg text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; fill: var(--muted); }

  .bars { display: grid; gap: 8px; }
  .brow { display: grid; grid-template-columns: 64px 1fr; gap: 10px; align-items: center; font-size: 13px; }
  .barea { display: flex; align-items: center; gap: 8px; }
  .fill { height: 14px; width: calc((100% - 84px) * var(--k, 0)); min-width: 2px; background: var(--s1); border-radius: 0 4px 4px 0; }
  .brow:hover .fill { filter: brightness(1.12); }
  .val { font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
  .seg8 { display: flex; gap: 2px; height: 8px; margin: 6px 0 10px; }
  .seg8 span { border-radius: 4px; background: var(--c); min-width: 2px; }
  .twocol { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
  .twocol > .card { margin-bottom: 0; }
  details summary { cursor: pointer; font-weight: 600; }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 18px; margin: 10px 0 0; font-size: 13px; }
  dl.kv dt { color: var(--ink2); } dl.kv dd { margin: 0; word-break: break-word; }
  footer { color: var(--ink2); font-size: 12px; margin-top: 18px; display: grid; gap: 4px; }
  footer a, dd a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 3px; }
  @media print { .filters { display: none; } .card { break-inside: avoid; } body { background: #fff; } }
</style>
</head>
<body>
<div class="page" id="app"></div>
<div id="gtip" class="tip" hidden></div>
<script id="payload" type="application/json">__REPORT_DATA__</script>
<script>
(function () {
  "use strict";
  var P = JSON.parse(document.getElementById('payload').textContent);
  var R = P.results, S = P.series, M = P.meta || {};
  var EPS = R.endpoints || [];
  var run = R.run || {}, lat = R.latency || {};

  /* ---------- small helpers (all text goes through textContent / createTextNode) ---------- */
  function h(tag, attrs) {
    var n = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k]; if (v == null || v === false) return;
      if (k === 'class') n.className = v; else if (k === 'style') n.style.cssText = v;
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? '' : v);
    });
    (function add(list) { list.forEach(function (c) {
      if (c == null || c === false) return;
      if (Array.isArray(c)) return add(c);
      n.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    }); })(kids);
    return n;
  }
  var SVGNS = 'http://www.w3.org/2000/svg';
  function sv(tag, attrs) {
    var n = document.createElementNS(SVGNS, tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      // theme colours are CSS variables; routing them through style works in every browser, presentation attributes do not always resolve var()
      if ((k === 'fill' || k === 'stroke') && typeof v === 'string' && v.indexOf('var(') === 0) n.style.setProperty(k, v); else n.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) if (arguments[i] != null) n.appendChild(typeof arguments[i] === 'string' ? document.createTextNode(arguments[i]) : arguments[i]);
    return n;
  }
  function isNum(v) { return typeof v === 'number' && isFinite(v); }
  function fmtMs(v) {
    if (!isNum(v)) return '–';
    if (v >= 1000) { var s = v / 1000; return (s >= 100 ? s.toFixed(0) : s >= 10 ? s.toFixed(1) : s.toFixed(2)) + ' s'; }
    return (v >= 100 ? v.toFixed(0) : v >= 10 ? v.toFixed(1) : v.toFixed(2)) + ' ms';
  }
  function fmtInt(v) { return isNum(v) ? Math.round(v).toLocaleString('en-US') : '–'; }
  function fmtNum(v, d) { return isNum(v) ? v.toLocaleString('en-US', { maximumFractionDigits: d == null ? 2 : d }) : '–'; }
  function fmtPct(rate) {
    if (!isNum(rate)) return '–';
    var p = rate * 100; return (p === 0 || p === 100 ? p.toFixed(0) : p < 1 ? p.toFixed(2) : p.toFixed(1)) + '%';
  }
  function fmtBytes(b) {
    if (!isNum(b)) return '–';
    var u = ['B', 'KB', 'MB', 'GB'], i = 0; while (b >= 1024 && i < u.length - 1) { b /= 1024; i++; }
    return b.toFixed(i ? 1 : 0) + ' ' + u[i];
  }
  function fmtDur(sec) {
    if (!isNum(sec)) return '–'; sec = Math.round(sec);
    return sec < 60 ? sec + 's' : Math.floor(sec / 60) + 'm' + (sec % 60 ? ' ' + (sec % 60) + 's' : '');
  }
  function ext(url, text) { return h('a', { href: url, target: '_blank', rel: 'noopener noreferrer' }, text); }
  var K6_DOCS = 'https://grafana.com/docs/k6/latest/', K6_REPO = 'https://github.com/grafana/k6', K6_LICENSE = 'https://github.com/grafana/k6/blob/master/LICENSE.md';
  function pathOf(url) { try { var u = new URL(url); return u.pathname + (u.search || ''); } catch (e) { return url; } }
  function shortLabel(e) { return /^[A-Z]+ https?:\/\//.test(e.label) ? e.method + ' ' + pathOf(e.url) : e.label; }
  function epName(e) { return '#' + e.index + ' ' + shortLabel(e); }

  var MEANING = { 200: 'OK', 201: 'Created', 202: 'Accepted', 204: 'No Content', 301: 'Moved Permanently', 302: 'Found', 304: 'Not Modified',
    400: 'Bad Request', 401: 'Unauthorized', 403: 'Forbidden', 404: 'Not Found', 405: 'Method Not Allowed', 408: 'Request Timeout', 409: 'Conflict',
    415: 'Unsupported Media Type', 422: 'Unprocessable Entity', 429: 'Too Many Requests', 500: 'Internal Server Error', 502: 'Bad Gateway',
    503: 'Service Unavailable', 504: 'Gateway Timeout' };
  var ICON = { good: '✓', warn: '!', crit: '✕', info: 'i', serious: '!' };
  function icon(level) { return h('span', { class: 'ico ' + level, 'aria-hidden': 'true' }, ICON[level] || 'i'); }

  /* ---------- global hover tooltip for bars and rows ---------- */
  var gtip = document.getElementById('gtip');
  function attachTip(node, textFn) {
    function move(ev) {
      gtip.hidden = false; gtip.replaceChildren(h('div', null, textFn()));
      var x = ev.clientX + 14, y = ev.clientY + 14, w = gtip.offsetWidth;
      if (x + w > window.innerWidth - 8) x = ev.clientX - w - 14;
      gtip.style.left = Math.max(4, x) + 'px'; gtip.style.top = y + 'px';
    }
    node.addEventListener('pointermove', move);
    node.addEventListener('pointerleave', function () { gtip.hidden = true; });
    node.addEventListener('focus', function () { var r = node.getBoundingClientRect(); move({ clientX: r.left + 20, clientY: r.top }); });
    node.addEventListener('blur', function () { gtip.hidden = true; });
  }

  /* ---------- scope: "all" or an endpoint index ---------- */
  var state = { scope: 'all', view: 'charts' };
  (function readHash() { var m = /ep=(\d+)/.exec(location.hash); if (m && EPS[Number(m[1]) - 1]) state.scope = Number(m[1]); })();

  function sumOk() { return EPS.reduce(function (s, e) { return s + (e.ok || 0); }, 0); }
  function scopeInfo(scope) {
    if (scope === 'all') {
      var okAll = sumOk(), total = run.requests || 0;
      var okLat = lat.overallOk;
      // which requests the response times describe: 'ok' = successful ones, 'errors' = nothing succeeded, 'mixed' = older results file without a separate success latency
      var kind = okLat || okAll === total ? 'ok' : okAll === 0 ? 'errors' : 'mixed';
      return { name: 'All endpoints', requests: total, ok: okAll, failed: total - okAll, noResponse: EPS.reduce(function (s, e) { return s + (e.noResponse || 0); }, 0),
        successRate: total ? okAll / total : null, rps: run.requestsPerSec, lat: okLat || lat.overall, latKind: kind,
        sr: S && S.all, e: null };
    }
    var e = EPS[scope - 1];
    return { name: epName(e), requests: e.requests, ok: e.ok, failed: e.failed, noResponse: e.noResponse, successRate: e.successRate, rps: e.requestsPerSec,
      lat: e.latencyOk || e.latencyAll, latKind: e.latencyOk ? 'ok' : 'errors', sr: S && S.endpoints && S.endpoints[String(e.index)], e: e };
  }

  /* ---------- result banner ---------- */
  function bannerModel() {
    var status = M.status, detail = M.detail || '';
    var noSuccess = EPS.some(function (e) { return e.status === 'NO_SUCCESS'; });
    var thrFail = (R.thresholds || []).some(function (t) { return !t.ok; });
    if (!status) status = (run.stoppedEarly || noSuccess) ? 'FAILED' : 'PASSED';
    var sla = /SLA MISSED/i.test(detail) || (!M.status && thrFail);
    if (status === 'FAILED') return { level: 'crit', title: 'FAILED', detail: detail };
    if (sla) return { level: 'warn', title: 'PASSED – SLA missed', detail: detail || 'The test ran, but one or more thresholds were not met.' };
    return { level: 'good', title: 'PASSED', detail: detail || 'The test ran and all thresholds were met.' };
  }

  /* ---------- observations (rule based hints, each one is a plain sentence) ---------- */
  function codesText(e) {
    var parts = Object.keys(e.statusCodes || {}).map(function (c) { return (c === 'noResponse' ? 'no response' : c === 'other' ? 'other status' : 'HTTP ' + c) + ' ×' + fmtInt(e.statusCodes[c]); });
    return parts.length ? 'Seen: ' + parts.join(', ') + '.' : '';
  }
  function thresholdObserved(t) {
    var m = /^(avg|min|med|max|p\((\d+(?:\.\d+)?)\))\s*(<=|>=|<|>)\s*([\d.]+)$/.exec(t.rule), L = lat.overall;
    if (t.metric === 'http_req_duration' && m && L) {
      var key = m[1] === 'avg' ? 'avg' : m[1] === 'med' ? 'median' : m[1] === 'min' ? 'min' : m[1] === 'max' ? 'max' : { '90': 'p90', '95': 'p95', '99': 'p99' }[m[2]];
      return key && isNum(L[key]) ? fmtMs(L[key]) : '–';
    }
    if (t.metric === 'http_req_failed' && isNum(run.failedRate)) return fmtPct(run.failedRate);
    return '–';
  }
  function saturationHint(info) {
    if (!S || !info.sr || !info.sr.rps) return null;
    var vus = S.vus, rps = info.sr.rps, reqs = info.sr.requests;
    var l = info.sr.latencyOk && info.sr.latencyOk.avg.some(isNum) ? info.sr.latencyOk.avg : info.sr.latency.avg;
    var vals = vus.filter(isNum); if (vals.length < 5) return null;
    var maxV = Math.max.apply(null, vals); if (maxV < 4) return null;
    var early = vus.findIndex(function (v) { return isNum(v) && v >= 0.5 * maxV; }), peak = vus.indexOf(maxV);
    if (early < 0 || peak <= early || !reqs[early] || !reqs[peak] || !isNum(l[early]) || !isNum(l[peak]) || !rps[early]) return null;
    var bestRps = Math.max.apply(null, rps.slice(early).filter(isNum));
    if (vus[peak] >= 1.4 * vus[early] && rps[peak] <= 1.15 * rps[early] && l[peak] >= 1.5 * l[early])
      return 'Throughput stopped growing (' + rps[early].toFixed(1) + ' → ' + rps[peak].toFixed(1) + ' req/s) while virtual users rose ' + vus[early] + ' → ' + vus[peak] +
        ' and average response time grew ' + (l[peak] / l[early]).toFixed(1) + '×. The API looks saturated at about ' + bestRps.toFixed(1) + ' req/s (a hint, not proof).';
    return null;
  }
  function observations(scope, info) {
    var out = [], add = function (level, text) { out.push({ level: level, text: text }); };
    var eps = scope === 'all' ? EPS : [EPS[scope - 1]];
    if (run.stoppedEarly) add('crit', 'The run was stopped early by the engine; the build log shows the reason.');
    eps.forEach(function (e) {
      if (e.status === 'NO_SUCCESS') add('crit', epName(e) + ' never returned the expected HTTP ' + e.expectedStatus.join(' or ') + '. ' + codesText(e));
      else if (e.status === 'PARTIAL') add('warn', epName(e) + ': ' + fmtPct(e.errorRate) + ' of its requests did not return the expected status. ' + codesText(e));
      else if (e.status === 'NOT_RUN') add('info', epName(e) + ' was not called.');
      if (e.noResponse > 0 && e.status !== 'NO_SUCCESS') add('warn', epName(e) + ': ' + fmtInt(e.noResponse) + ' request(s) got no HTTP response (timeout or connection error).');
    });
    if (scope === 'all') {
      var L = lat.overall;
      if (L && L.max >= 59000) add('warn', 'At least one request waited about 60 s: k6’s default request timeout. The API did not answer in time.');
      (R.thresholds || []).filter(function (t) { return !t.ok; }).forEach(function (t) {
        add('warn', 'SLA not met: ' + t.metric + ' ' + t.rule + ' (observed ' + thresholdObserved(t) + ').');
      });
      var latThr = (R.thresholds || []).filter(function (t) { return t.metric === 'http_req_duration'; });
      if (latThr.length && latThr.every(function (t) { return t.ok; }) && EPS.some(function (e) { return e.status === 'NO_SUCCESS'; }))
        add('warn', 'The latency thresholds passed only because failed requests answer quickly. Treat them as not met until every endpoint succeeds.');
      var timed = EPS.filter(function (e) { return e.latencyOk; }).sort(function (a, b) { return a.latencyOk.p95 - b.latencyOk.p95; });
      if (timed.length >= 2) {
        var fast = timed[0], slow = timed[timed.length - 1];
        if (fast.latencyOk.p95 > 0 && slow.latencyOk.p95 / fast.latencyOk.p95 >= 2)
          add('info', epName(slow) + ' is ' + (slow.latencyOk.p95 / fast.latencyOk.p95).toFixed(1) + '× slower than ' + epName(fast) + ' at p95 (' + fmtMs(slow.latencyOk.p95) + ' vs ' + fmtMs(fast.latencyOk.p95) + ').');
      }
    }
    var sat = saturationHint(info); if (sat) add('warn', sat);
    if (!out.some(function (o) { return o.level === 'crit' || o.level === 'warn'; })) {
      add('good', scope === 'all' ? 'Every request on every endpoint returned the expected status.' : 'Every request returned the expected status.');
      if (scope === 'all' && (R.thresholds || []).length && (R.thresholds || []).every(function (t) { return t.ok; })) add('good', 'All k6 thresholds were met.');
    }
    return out;
  }

  /* ---------- line charts: inline SVG, one y axis per chart, synced crosshair ---------- */
  var charts = [];
  function niceStep(raw) { var p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
  function lineChart(host, cfg) {
    var H = cfg.height || 200, ml = 52, mr = 14, mt = 10, mb = 24;
    var tip = h('div', { class: 'tip', hidden: true }); host.appendChild(tip);
    var api = { idx: null }, svgEl = null, geo = null;
    function draw() {
      if (svgEl) svgEl.remove();
      var W = Math.max(300, host.clientWidth), iw = W - ml - mr, ih = H - mt - mb, xs = cfg.x;
      var xmax = Math.max(xs[xs.length - 1], 1), all = [];
      cfg.series.forEach(function (s) { s.values.forEach(function (v) { if (isNum(v)) all.push(v); }); });
      var vmax = all.length ? Math.max.apply(null, all) : 1; if (vmax <= 0) vmax = 1;
      var step = niceStep(vmax / 4), ymax = step * Math.ceil(vmax / step);
      var X = function (t) { return ml + t / xmax * iw; }, Y = function (v) { return mt + ih - v / ymax * ih; };
      geo = { X: X, Y: Y, iw: iw, W: W };
      var g = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', tabindex: '0', 'aria-label': cfg.title + '. Use the left and right arrow keys to read values.', height: H });
