parameters:
  - name: reportRecipient
    type: string
    default: 'iankit7667@gmail.com,ankit.kumar@prowesssoft.com'
  - name: reportCc
    type: string
    default: 'none' # optional Cc, comma separated; 'none' (or empty) = no Cc
  - name: apiRepoUrl
    type: string
    default: '' # Defaults to empty for imported CI/CD mode
  - name: apiName
    type: string
    default: '' # Subdirectory name under the cloned repo where load-profile.json exists
  - name: profileName
    type: string
    default: 'load-profile.json' # File name of the load profile configuration
  - name: debug
    type: string
    default: 'false' # Enable k6 HTTP debugging

jobs:
  - job: RunPerformanceTests
    displayName: 'Run k6 Performance Tests'
    pool:
      vmImage: 'ubuntu-latest'
    
    # 1. Reference the SMTP secret variable group
    variables:
      - group: perf-smtp
      - group: perf-oauth # OAUTH_TOKEN_URL / OAUTH_CLIENT_ID / OAUTH_CLIENT_SECRET / OAUTH_SCOPE for authType OAUTH2_CLIENT_CREDENTIALS profiles
      - group: perf-basic-auth # BASIC_USERNAME / BASIC_PASSWORD for authType BASIC profiles
      - group: perf-client-id # client_id / client_secret for {{CLIENT_ID}} / {{CLIENT_SECRET}} in the profile; optional GITHUB_PAT for private API repos

    steps:
      # SCENARIO A: Dynamic Manual Run (triggered from master pipeline with an apiRepoUrl parameter)
      - ${{ if ne(parameters.apiRepoUrl, '') }}:
        # Checkout tooling first so the checkout step cannot clean the cloned API repo
        - checkout: self
          path: s/master-pipeline-repo
          displayName: 'Checkout Master Pipeline Tooling'

        - script: |
            # GITHUB_PAT is optional (only needed for private API repos)
            # (an undefined ADO variable arrives as literal text starting with a dollar-paren)
            if [ -n "$GIT_TOKEN" ] && [ "${GIT_TOKEN#\$(}" = "$GIT_TOKEN" ]; then
              AUTH=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 -w0)
              git -c http.extraHeader="AUTHORIZATION: basic $AUTH" clone "${{ parameters.apiRepoUrl }}" "$(Pipeline.Workspace)/s/api-repo"
            else
              git clone "${{ parameters.apiRepoUrl }}" "$(Pipeline.Workspace)/s/api-repo"
            fi
          displayName: 'Fetch API Load Configuration (Dynamic Clone)'
          env:
            GIT_TOKEN: $(GITHUB_PAT)

      # SCENARIO B: Imported Template Run (called directly from target API repos)
      - ${{ if eq(parameters.apiRepoUrl, '') }}:
        - checkout: self
          path: s/api-repo
          displayName: 'Checkout API Repository (Self)'
        
        - checkout: performance-testing-pipeline-template
          path: s/master-pipeline-repo
          displayName: 'Checkout Master Pipeline Tooling'

      # 2. Prepare the engine script and its auth modules (auth/) by placing them in the API configuration workspace
      - script: |
          cp $(Pipeline.Workspace)/s/master-pipeline-repo/k6-engine-script.js $(Pipeline.Workspace)/s/api-repo/
          cp -r $(Pipeline.Workspace)/s/master-pipeline-repo/auth $(Pipeline.Workspace)/s/api-repo/
        displayName: 'Prepare Engine Script'

      # 3. Run the containerized k6 stress test (the docker command and the credential variable list live in ci/run-k6.sh, shared with Jenkins)
      - script: |
          API_NAME="${{ parameters.apiName }}"
          PROFILE_NAME="${{ parameters.profileName }}"
          if [ -z "$PROFILE_NAME" ]; then
            PROFILE_NAME="load-profile.json"
          fi

          if [ -z "$API_NAME" ]; then
            PROFILE_REL="$PROFILE_NAME"
          else
            PROFILE_REL="$API_NAME/$PROFILE_NAME"
          fi

          # Do not stop on a k6 failure: the report and email must still go out. The exit code is recorded and enforced in the final step.
          set +e
          bash $(Pipeline.Workspace)/s/master-pipeline-repo/ci/run-k6.sh "$(Pipeline.Workspace)/s/api-repo" "$PROFILE_REL" "$DEBUG_PARAM"
          K6_EXIT=$?
          echo "##vso[task.setvariable variable=K6_EXIT_CODE]$K6_EXIT"
          exit 0
        displayName: 'Execute k6 Stress Test Container'
        env:
          DEBUG_PARAM: ${{ parameters.debug }}
          # Variable group values -> the environment variable names the engine reads (see README, "Credential contract")
          CLIENT_ID: $(client_id)
          CLIENT_SECRET: $(client_secret)
          OAUTH_TOKEN_URL: $(OAUTH_TOKEN_URL)
          OAUTH_CLIENT_ID: $(OAUTH_CLIENT_ID)
          OAUTH_CLIENT_SECRET: $(OAUTH_CLIENT_SECRET)
          OAUTH_SCOPE: $(OAUTH_SCOPE)
          BASIC_USERNAME: $(BASIC_USERNAME)
          BASIC_PASSWORD: $(BASIC_PASSWORD)

      # 3b. Build the report (report.html) from results.json + the time series in k6's dashboard export (k6-dashboard.html). Never fails the build.
      - script: |
          CI_DIR="$(Pipeline.Workspace)/s/master-pipeline-repo/ci"
          REASON_FILE="$(Pipeline.Workspace)/s/api-repo/k6-reason.txt"
          STATUS=$(sh "$CI_DIR/status.sh" "$K6_EXIT_CODE")
          DETAIL=$(sh "$CI_DIR/status.sh" "$K6_EXIT_CODE" detail "$REASON_FILE")
          python $(Pipeline.Workspace)/s/master-pipeline-repo/report/build_report.py             --results "$(Pipeline.Workspace)/s/api-repo/results.json"             --dashboard "$(Pipeline.Workspace)/s/api-repo/k6-dashboard.html"             --out "$(Pipeline.Workspace)/s/api-repo/report.html"             --status "$STATUS"             --detail "$DETAIL"             --exit-code "$K6_EXIT_CODE"             --build-url "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
        displayName: 'Build Performance Report'
        condition: succeededOrFailed()
        continueOnError: true
        env:
          K6_EXIT_CODE: $(K6_EXIT_CODE)

      # 4. Publish report.html (the report built in step 3b) to Build Artifacts (no report exists when k6 failed before the load started)
      - task: PublishBuildArtifacts@1
        inputs:
          PathtoPublish: '$(Pipeline.Workspace)/s/api-repo/report.html'
          ArtifactName: 'StressTestReport'
          publishLocation: 'Container'
        displayName: 'Archive Test Report HTML'
        condition: succeededOrFailed()
        continueOnError: true

      # 5. Execute the SMTP email delivery using the Python utility script
      - script: |
          API_NAME="${{ parameters.apiName }}"
          PROFILE_NAME="${{ parameters.profileName }}"
          if [ -z "$PROFILE_NAME" ]; then
            PROFILE_NAME="load-profile.json"
          fi

          if [ -z "$API_NAME" ]; then
            HOST_PROFILE_PATH="$(Pipeline.Workspace)/s/api-repo/$PROFILE_NAME"
          else
            HOST_PROFILE_PATH="$(Pipeline.Workspace)/s/api-repo/$API_NAME/$PROFILE_NAME"
          fi

          # PASSED / FAILED (+ detail line): one rule shared with Jenkins (ci/status.sh)
          CI_DIR="$(Pipeline.Workspace)/s/master-pipeline-repo/ci"
          STATUS=$(sh "$CI_DIR/status.sh" "$K6_EXIT_CODE")
          REASON_FILE="$(Pipeline.Workspace)/s/api-repo/k6-reason.txt"
          DETAIL=$(sh "$CI_DIR/status.sh" "$K6_EXIT_CODE" detail "$REASON_FILE")
          echo "Sending report email for $HOST_PROFILE_PATH, status: $STATUS"

          # apiName / artifact_version for the subject are read from the profile by send-email.py (--profile)
          python $(Pipeline.Workspace)/s/master-pipeline-repo/send-email.py             --to "${{ parameters.reportRecipient }}"             --cc "${{ parameters.reportCc }}"             --profile "$HOST_PROFILE_PATH"             --status "$STATUS"             --detail "$DETAIL"             --report "$(Pipeline.Workspace)/s/api-repo/report.html"             --build-url "$(System.TeamFoundationCollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
        displayName: 'Email Stress Test Report'
        condition: succeededOrFailed()
        env:
          K6_EXIT_CODE: $(K6_EXIT_CODE)
          SMTP_HOST: $(SMTP_HOST)
          SMTP_PORT: $(SMTP_PORT)
          SMTP_USER: $(SMTP_USER)
          SMTP_PASSWORD: $(SMTP_PASS)
          SMTP_FROM: $(SMTP_FROM)
          SMTP_TLS: $(SMTP_TLS)
          MANDATORY_RECIPIENTS: $(MANDATORY_RECIPIENTS)

      # 6. Decide the build result after the report and email have gone out.
      #    exit 0  = green.
      #    exit 99 = SLA MISSED (thresholds crossed): the build is NOT failed, but ends "succeeded with issues" (warning) and the email is PASSED with an "SLA MISSED" message.
      #    other   = the test could not run (rejected credentials = 108, setup/script error = 107, bad profile ...): the build fails.
      - script: |
          if [ "$K6_EXIT_CODE" = "0" ]; then
            echo "k6 passed all thresholds."
          elif [ "$K6_EXIT_CODE" = "99" ]; then
            echo "##vso[task.logissue type=warning]SLA MISSED: k6 thresholds were crossed (exit code 99). See the report; the build is not failed for SLA misses."
          else
            CI_DIR="$(Pipeline.Workspace)/s/master-pipeline-repo/ci"
            REASON_FILE="$(Pipeline.Workspace)/s/api-repo/k6-reason.txt"
            DETAIL=$(sh "$CI_DIR/status.sh" "$K6_EXIT_CODE" detail "$REASON_FILE")
            echo "##vso[task.logissue type=error]$DETAIL (k6 exit code $K6_EXIT_CODE)"
            exit 1
          fi
        displayName: 'Check Test Execution'
        condition: succeededOrFailed()
        env:
          K6_EXIT_CODE: $(K6_EXIT_CODE)
